<!-- Non-blocking: the page paints in system fonts at once and swaps when these arrive. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --grad-1: #1E40AF;
    --grad-2: #2563EB;
    --grad-3: #3B82F6;
    --grad-4: #06B6D4;
    --card: #FFFFFF;
    --ink: #0F172A;
    --slate: #475569;
    --line: #E2E8F0;
    --blue: #2563EB;
    --blue-deep: #1D4ED8;
    --tint: #EFF6FF;
    --tint-line: #BFDBFE;
    --linkedin: #0A66C2;
    --on-blue: #FFFFFF;
    --grid: rgba(255, 255, 255, .07);
    --shadow-card: 0 30px 60px -20px rgba(11, 31, 92, .45), 0 10px 24px -12px rgba(11, 31, 92, .3);
    --shadow-btn: 0 10px 24px -10px rgba(37, 99, 235, .6);
  }
  * { box-sizing: border-box; margin: 0; }
  html { font-size: 100%; -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    color: var(--ink);
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background-color: var(--grad-2);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(60% 40% at 100% 100%, rgba(255, 255, 255, .28), transparent 70%),
      linear-gradient(150deg, var(--grad-1), var(--grad-2) 35%, var(--grad-3) 65%, var(--grad-4));
    background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
    background-attachment: fixed;
  }

  .card {
    width: 100%; max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    padding: 36px 24px 24px;
    text-align: center;
    box-shadow: var(--shadow-card);
    animation: rise .55s cubic-bezier(.22, 1, .36, 1);
  }
  /* Visible from the first frame; the motion is decoration, never a gate. */
  @keyframes rise { from { transform: translateY(20px); } }

  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 20px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, var(--blue-deep), var(--grad-3) 55%, var(--grad-4));
    color: var(--on-blue);
    font: 700 1.625rem/1 "Space Grotesk", sans-serif; letter-spacing: -.02em;
    box-shadow: var(--shadow-btn);
  }
  .eyebrow {
    font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--blue);
  }
  h1 {
    margin-top: 8px;
    font: 700 2.25rem/1.05 "Space Grotesk", sans-serif; letter-spacing: -.03em;
  }
  .role { margin-top: 10px; font-size: 1rem; color: var(--slate); }
  .role strong { font-weight: 600; color: var(--ink); }

  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .tags span {
    font-size: .8125rem; font-weight: 600; color: var(--blue-deep);
    padding: 6px 12px; border-radius: 999px;
    background: var(--tint); border: 1px solid var(--tint-line);
  }

  .actions { display: grid; gap: 12px; margin-top: 28px; text-align: left; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 68px; padding: 0 18px;
    border-radius: 18px; text-decoration: none;
    font: 600 1.0625rem/1.2 "Archivo", sans-serif;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background-color .2s ease;
  }
  .btn .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
  }
  .btn .label { flex: 1; }
  .btn .label small { display: block; font-weight: 400; font-size: .8125rem; margin-top: 3px; }
  .btn .arrow { flex: none; transition: transform .2s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--grad-4); outline-offset: 3px; }

  .primary {
    color: var(--on-blue);
    background: linear-gradient(135deg, var(--blue-deep), var(--grad-3));
    box-shadow: var(--shadow-btn);
  }
  .primary .icon { background: rgba(255, 255, 255, .18); }
  .primary small { color: rgba(255, 255, 255, .82); }
  .primary:hover { box-shadow: 0 14px 30px -10px rgba(37, 99, 235, .7); }

  .secondary { color: var(--ink); background: var(--card); border: 1.5px solid var(--line); }
  .secondary .icon { background: var(--linkedin); color: var(--on-blue); }
  .secondary small { color: var(--slate); }
  .secondary .arrow { color: var(--slate); }
  .secondary:hover { border-color: var(--tint-line); background: var(--tint); }

  footer { margin-top: 18px; padding-top: 8px; border-top: 1px solid var(--line); }
  footer a {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px;
    color: var(--slate); font-size: .9375rem; text-decoration: none;
    border-radius: 10px; cursor: pointer; transition: color .2s ease;
  }
  footer a:hover { color: var(--blue); }
  footer a:focus-visible { outline: 2px solid var(--blue); }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn, .btn .arrow { transition: none; }
  }
</style>
</head>
